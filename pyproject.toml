[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nxo-ws-export"
version = "0.1.0"
description = "Export JetBrains Writerside projects to PDF (light/dark) and DOCX using the official Writerside builder as the renderer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "playwright==1.63.0",
  "pypdf>=5.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
nxo-ws-export = "nxo_ws_export.cli:main"

[tool.setuptools]
# Sources live directly in src/ and are installed as the `nxo_ws_export` package.
package-dir = { "nxo_ws_export" = "src" }
# Keep in sync with src/ (tests/test_architecture.py checks it).
packages = [
  "nxo_ws_export",
  "nxo_ws_export.app",
  "nxo_ws_export.browser",
  "nxo_ws_export.browser.assets",
  "nxo_ws_export.domain",
  "nxo_ws_export.exporters",
  "nxo_ws_export.exporters.docx",
  "nxo_ws_export.exporters.docx.html",
  "nxo_ws_export.exporters.docx.ooxml",
  "nxo_ws_export.exporters.docx.ooxml.passes",
  "nxo_ws_export.exporters.docx.styles",
  "nxo_ws_export.exporters.docx.theme",
  "nxo_ws_export.exporters.pdf",
  "nxo_ws_export.sources",
]

[tool.setuptools.package-data]
"*" = ["*.js", "*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: needs Docker + the Writerside builder image + Chromium (slow)",
  "browser: needs Playwright Chromium",
]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PLW1510"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["nxo_ws_export"]
